name: Build C++ to EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile C++ to EXE
      run: |
        g++ -static main.cpp -o main.exe

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: main-exe
        path: main.exe
